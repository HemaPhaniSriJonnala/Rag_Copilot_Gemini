services:
  - type: web
    name: rag-copilot-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # paste your key in the Render dashboard
      - key: FRONTEND_URL
        sync: false          # paste your Vercel URL after deploying frontend
